name: 'Compile LaTeX'
description: 'Compiles LaTeX document to PDF inside the project devcontainer'
inputs:
  root_file:
    description: 'Root LaTeX file to compile'
    required: true
    default: 'main.tex'
outputs:
  pdf_path:
    description: 'Path to the compiled PDF'
    value: 'main.pdf'
runs:
  using: 'composite'
  steps:
    - name: Compile LaTeX document in devcontainer
      shell: bash
      env:
        ROOT_FILE: ${{ inputs.root_file }}
      run: |
        rm -f main.pdf
        chmod +x .devcontainer/exec.sh
        .devcontainer/exec.sh xelatex -interaction=nonstopmode "$ROOT_FILE"
        .devcontainer/exec.sh xelatex -interaction=nonstopmode "$ROOT_FILE"
        .devcontainer/exec.sh sh -c 'chmod -f a+rw *.pdf *.aux *.log *.out 2>/dev/null || true'

    - name: Debug compilation output
      shell: bash
      run: |
        echo "=== LaTeX compilation completed ==="
        echo "Current directory: $(pwd)"
        echo "Looking for generated files:"
        ls -la
        echo "=== Searching for PDF files ==="
        find . -name "*.pdf" -type f
        echo "=== Checking for main.pdf specifically ==="
        if [ -f "main.pdf" ]; then
          echo "✅ main.pdf found"
          ls -la main.pdf
        else
          echo "❌ main.pdf not found"
          exit 1
        fi
